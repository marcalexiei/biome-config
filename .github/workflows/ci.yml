name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Format root
        run: pnpm run format

      - name: Format tests
        run: pnpm run format:tests

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
        env:
          # unset since setup-node v7; pnpm's warning would leak into test snapshots
          NODE_AUTH_TOKEN: ''

  check-rules-configuration:
    name: Check that all rules are configured

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run script
        run: pnpm run check-rules-configuration

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - checks
      - check-rules-configuration
    steps:
      - name: Exit with error if some jobs are not successful
        run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
